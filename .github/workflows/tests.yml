name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: >
          pytest -n auto --dist loadfile
          --cov=image_differ --cov-report=term-missing --cov-report=xml
          --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml

  # Single, stable check to mark as "required" in branch protection,
  # so you don't have to list every matrix combination.
  all-tests-passed:
    name: All tests passed
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job failed
        if: needs.test.result != 'success'
        run: |
          echo "Test jobs result: ${{ needs.test.result }}"
          exit 1
      - run: echo "All test jobs succeeded."
